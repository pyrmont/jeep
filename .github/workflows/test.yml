name: test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # Linux
  test-linux:
    name: "Test on Linux"
    runs-on: ubuntu-latest
    steps:
    - name: "checkout project"
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: "find latest version of janet"
      uses: oprypin/find-latest-tag@v1
      with:
        repository: janet-lang/janet
        releases-only: true
        prefix: 'v'
      id: janet-ver
    - name: "set prefix"
      shell: bash
      run: echo "PREFIX=$GITHUB_WORKSPACE/.janet" >> $GITHUB_ENV
    - name: "set paths"
      shell: bash
      run: |
        echo "$PREFIX/bin" >> $GITHUB_PATH
        echo "JANET_HEADERPATH=$PREFIX/include" >> $GITHUB_ENV
        echo "JANET_BINPATH=$PREFIX/bin" >> $GITHUB_ENV
        echo "JANET_LIBPATH=$PREFIX/lib" >> $GITHUB_ENV
        echo "JANET_MANPATH=$PREFIX/man" >> $GITHUB_ENV
        echo "JANET_PATH=$PREFIX" >> $GITHUB_ENV
    - name: "make directories"
      shell: bash
      run: mkdir -p $PREFIX
    - name: "download janet"
      shell: bash
      run: curl -LO https://github.com/janet-lang/janet/releases/download/${{ steps.janet-ver.outputs.tag }}/janet-${{ steps.janet-ver.outputs.tag }}-linux-x64.tar.gz
    - name: "extract janet"
      shell: bash
      run: tar -xzf janet-${{ steps.janet-ver.outputs.tag }}-linux-x64.tar.gz --strip-components=2 -C $PREFIX
    - name: "run tests"
      shell: bash
      run: 'for f in test/*.janet; do janet "$f" || { rc=$?; break; }; done; (exit ${rc:-0})'
  # macOS
  test-macos:
    name: "Test on macOS"
    runs-on: macos-latest
    steps:
    - name: "checkout project"
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: "find latest version of janet"
      uses: oprypin/find-latest-tag@v1
      with:
        repository: janet-lang/janet
        releases-only: true
        prefix: 'v'
      id: janet-ver
    - name: "set prefix"
      shell: bash
      run: echo "PREFIX=$GITHUB_WORKSPACE/.janet" >> $GITHUB_ENV
    - name: "set paths"
      shell: bash
      run: |
        echo "$PREFIX/bin" >> $GITHUB_PATH
        echo "JANET_HEADERPATH=$PREFIX/include" >> $GITHUB_ENV
        echo "JANET_BINPATH=$PREFIX/bin" >> $GITHUB_ENV
        echo "JANET_LIBPATH=$PREFIX/lib" >> $GITHUB_ENV
        echo "JANET_MANPATH=$PREFIX/man" >> $GITHUB_ENV
        echo "JANET_PATH=$PREFIX" >> $GITHUB_ENV
    - name: "make directories"
      shell: bash
      run: mkdir -p $PREFIX
    - name: "download janet"
      shell: bash
      run: curl -LO https://github.com/janet-lang/janet/releases/download/${{ steps.janet-ver.outputs.tag }}/janet-${{ steps.janet-ver.outputs.tag }}-macos-aarch64.tar.gz
    - name: "extract janet"
      shell: bash
      run: tar -xzf janet-${{ steps.janet-ver.outputs.tag }}-macos-aarch64.tar.gz --strip-components=2 -C $PREFIX
    - name: "run tests"
      shell: bash
      run: 'for f in test/*.janet; do janet "$f" || { rc=$?; break; }; done; (exit ${rc:-0})'
  # Windows
  test-windows:
    name: "Test on Windows"
    runs-on: windows-latest
    steps:
    - name: "disable git autocrlf"
      shell: cmd
      run: git config --global core.autocrlf false
    - name: "checkout project"
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: "find latest version of janet"
      uses: oprypin/find-latest-tag@v1
      with:
        repository: janet-lang/janet
        releases-only: true
        prefix: 'v'
      id: janet-ver
    - name: "download janet"
      shell: cmd
      run: |
        set TAG=${{ steps.janet-ver.outputs.tag }}
        set TAG_NUM=%TAG:~1%
        set "URL=https://github.com/janet-lang/janet/releases/download/%TAG%/janet-%TAG_NUM%-windows-x64-installer.msi"
        curl -fSLo janet.msi %URL%
    - name: "install janet"
      shell: cmd
      run: msiexec /quiet /i janet.msi ALLUSERS=1 /log install.log && type install.log
    - name: "set janet paths"
      shell: cmd
      run: |
        echo C:\Program Files\Janet\bin>>%GITHUB_PATH%
        echo JANET_HEADERPATH=C:\Program Files\Janet\C>>%GITHUB_ENV%
        echo JANET_BINPATH=C:\Program Files\Janet\bin>>%GITHUB_ENV%
        echo JANET_LIBPATH=C:\Program Files\Janet\C>>%GITHUB_ENV%
        echo JANET_MANPATH=C:\Program Files\Janet\docs>>%GITHUB_ENV%
        echo JANET_PATH=C:\Program Files\Janet\Library>>%GITHUB_ENV%
    # Spork looks for vcvarsall.bat in the install locations of Visual
    # Studio 2017, 2019 and 2022, and the runner image carries 2026. It
    # skips that search entirely when INCLUDE, LIB and LIBPATH are already
    # set, so the environment is prepared here instead, locating whatever
    # version is present with Microsoft's own vswhere. The tests build an
    # executable via quickbin, so they have to run in the same invocation
    # for the environment to survive.
    - name: "run tests"
      shell: cmd
      run: |
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath`) do set "VSPATH=%%i"
        if not defined VSPATH exit /b 1
        call "%VSPATH%\VC\Auxiliary\Build\vcvarsall.bat" x64
        for %%F in (test\*.janet) do janet "%%F" || exit /b 1
